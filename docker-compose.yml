
services:
  app:
    build: .
    container_name: observability-app
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      LOG_LEVEL: info
      SERVICE_NAME: observability-demo
      OTEL_SERVICE_NAME: observability-demo
    depends_on:
      - prometheus
    restart: unless-stopped
  jaeger:
    image: jaegertracing/jaeger:latest
    container_name: observability-jaeger
    restart: unless-stopped
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"

  prometheus:
    image: prom/prometheus:latest
    container_name: observability-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: observability-grafana
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    restart: unless-stopped
